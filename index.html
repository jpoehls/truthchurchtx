<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth Church</title>
  <meta property="og:title" content="Truth Church">
  <meta name="twitter:title" content="Truth Church">
  
  <!-- Single Font Load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      
      /* Hardcoded Map Colors & Fonts */
      background-color: #0a0a0a;
      font-family: 'Inter', sans-serif;
      color: #e0e0e0;
    }

    /* SVG map fades in once loaded via JS toggling this class */
    #map-bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.4s ease-in;
      pointer-events: none;
      z-index: 0;
    }

    #map-bg.loaded {
      opacity: 1;
    }

    /* Sits above #map-bg and washes it with the bg color to fade the map lines */
    #map-overlay {
      position: fixed;
      inset: 0;
      background-color: #0a0a0a;
      opacity: 0.68;
      pointer-events: none;
      z-index: 1;
    }

    /* Canvas for persistent light trail */
    #light-trail {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Location dot */
    #locator {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      z-index: 3;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0  8px 2px currentColor,
        0 0 28px 8px currentColor,
        0 0 70px 20px currentColor;
      transition: left 2.8s cubic-bezier(0.45, 0, 0.55, 1),
                  top  2.8s cubic-bezier(0.45, 0, 0.55, 1);
      animation: dot-breathe 2.6s ease-in-out infinite;
    }

    #locator::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      opacity: 0;
      animation: ring-pulse 2.6s ease-out infinite;
    }

    @keyframes dot-breathe {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    @keyframes ring-pulse {
      0%   { transform: scale(0.6); opacity: 0.6; }
      100% { transform: scale(3.5); opacity: 0; }
    }

    @keyframes bubble-pulse {
      0%, 100% {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 18px 4px var(--verse-glow-color, rgba(255,255,255,0.12));
      }
      50% {
        transform: translateY(-1px) scale(1.005);
        box-shadow: 0 0 28px 8px var(--verse-glow-color, rgba(255,255,255,0.18));
      }
    }

    .verse-panel {
      position: fixed;
      right: auto;
      bottom: 8vh;
      transform: translateX(-50%);
      z-index: 4;
      inline-size: min(88vw, 720px);
      max-inline-size: 720px;
      padding: 1.25rem 1.4rem;
      border-radius: 34px;
      border: 1.5px solid #f5c842; /* Map dot color */
      color: #e0e0e0;
      background: transparent;
      
      /* Replaces the JS size calculation (clamp * 1.3 multiplier) */
      font-size: clamp(1.1rem, 2.6vw, 1.43rem); 
      
      box-shadow: 0 0 24px 8px rgba(245, 200, 66, 0.18);
      --verse-glow-color: rgba(245, 200, 66, 0.22);
      
      opacity: 0; /* JS handles fade in */
      transition: opacity 0.8s ease, border-color 0.22s ease, box-shadow 0.22s ease, height 0.5s ease;
      animation: bubble-pulse 2.6s ease-in-out infinite;
      overflow: hidden;
    }

    .verse-content {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    .verse-content.fade-out {
      opacity: 0;
      transform: translateY(0.3rem);
    }

    .verse-panel span {
      display: block;
      line-height: 1.45;
      white-space: pre-wrap;
      letter-spacing: 0.01em;
    }

    .verse-panel strong {
      display: block;
      margin-top: 0.8rem;
      font-weight: 600;
      opacity: 0.92;
    }

    /* Smashburger trail stamp */
    .burger-stamp {
      position: fixed;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      line-height: 1;
      pointer-events: none;
      z-index: 2;
      animation: burger-fade 28s ease-out forwards;
    }

    @keyframes burger-fade {
      0%   { opacity: 0.9; }
      100% { opacity: 0; }
    }

    .center {
      position: relative;
      z-index: 3;
      text-align: center;
      margin-top: 23vh;
    }

    /* ── Social Links Styling ────────────────────────────────────────────────── */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      margin-top: 2.5rem;
      position: relative;
    }

    .social-links a {
      color: #e0e0e0;
      transition: color 0.2s ease, transform 0.2s ease;
      
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
    }

    .social-links a:hover {
      color: #B69E71; /* d4af37 or c99f2e or b38f1d or B69E71 (official) */
      transform: scale(1.15) translateY(-2px);
    }

    .social-links svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
    }
    
    .social-links span {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .footer-copyright {
      position: fixed;
      bottom: 2vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #a0a0a0;
      text-align: center;
      white-space: nowrap; 
    }
  </style>
</head>
<body>
  <div id="map-bg"></div>
  <div id="map-overlay"></div>
  <canvas id="light-trail"></canvas>
  <div id="locator"></div>
  <div class="center">
    <img src="img/tc-wide-white.svg" alt="Truth Church logo" style="width: 100%; max-width: 70vw; margin-bottom: 1.4rem">
    
    <!-- Social Links -->
    <div class="social-links">
      <a href="https://www.youtube.com/@truthchurchtexas" target="_blank" aria-label="YouTube" title="YouTube">
        <svg viewBox="0 0 24 24">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <span>YouTube</span>
      </a>
      <a href="https://www.facebook.com/truthchurchtx" target="_blank" aria-label="Facebook" title="Facebook">
        <svg viewBox="0 0 24 24">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        <span>Facebook</span>
      </a>
      <a href="https://groupme.com/join_group/114571097/sni1lv1a" target="_blank" aria-label="GroupMe" title="GroupMe">
        <!-- Hashtag inside a chat bubble to represent GroupMe -->
        <svg viewBox="0 0 24 24">
          <path d="M11.996 0A12 12 0 0 0 0 12a11.96 11.96 0 0 0 2.378 7.185l-1.325 4.39a.48.48 0 0 0 .6.6l4.392-1.324A11.96 11.96 0 0 0 12 24c6.628 0 12-5.373 12-12S18.624 0 11.996 0Zm-2.73 18.067a3.02 3.02 0 0 1-3.02-3.02v-6.04a3.02 3.02 0 0 1 3.02-3.02h5.46a3.02 3.02 0 0 1 3.02 3.02v6.04a3.02 3.02 0 0 1-3.02 3.02Z"/>
        </svg>
        <span>GroupMe</span>
      </a>
      <a href="https://truthchurchtx.churchcenter.com" target="_blank" aria-label="Planning Center" title="Church Center App">
        <!-- Location pin with a cross cut out for Church Center -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm-1 9V9H9V7h2V5h2v2h2v2h-2v2h-2z"/>
        </svg>
        <span>Church Center</span>
      </a>
    </div>
  </div>

  <div class="verse-panel" aria-live="polite">
    <div class="verse-content"></div>
  </div>

  <div class="footer-copyright">
    &copy; 2026 Truth Church Texas. All rights reserved.
  </div>

  <script>
    // ─── Configuration ────────────────────────────────────────────────────────
    const MAP_FILE    = "dale_noir_20000m.svg";
    const DOT_COLOR   = "#f5c842"; // colorGold
    const TRAIL_COLOR = "#a8c8f0"; // colorStreetlight
    
    // Load the SVG async
    const mapBg = document.getElementById("map-bg");
    const img = new Image();
    img.onload = () => {
      mapBg.style.backgroundImage = `url('dalemaps/${MAP_FILE}')`;
      mapBg.classList.add("loaded"); 
    };
    img.src = `dalemaps/${MAP_FILE}`;

    // ─── Verse Panel Logic ───────────────────────────────────────────────────
    const VERSE_PANEL_ENABLED = new URLSearchParams(window.location.search).get("verse") === "y";
    const bibleVerses = [
      { text: "Go, therefore, and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe everything I have commanded you. And remember, I am with you always, to the end of the age.", reference: "Matthew 28:19–20" },
      { text: "Christ Jesus came into the world to save sinners.", reference: "1 Timothy 1:15" },
      { text: "For God loved the world in this way: He gave his one and only Son, so that everyone who believes in him will not perish but have eternal life.", reference: "John 3:16" },
      { text: "Light shines in the darkness for the upright. He is gracious, compassionate, and righteous.", reference: "Psalm 112:4" },
      { text: "Everyone who calls on the name of the Lord will be saved.", reference: "Romans 10:13" },
      { text: "For all have sinned and fall short of the glory of God, and all are justified freely by his grace through the redemption that came by Christ Jesus.", reference: "Romans 3:23–24" },
      { text: "\"I am the light of the world. Anyone who follows me will never walk in the darkness but will have the light of life.\" —Jesus", reference: "John 8:12" },
      { text: "If we walk in the light as he himself is in the light, we have fellowship with one another, and the blood of Jesus his Son cleanses us from all sin.", reference: "1 John 1:7" },
      { text: "\"I have come as light into the world, so that everyone who believes in me would not remain in darkness.\" —Jesus", reference: "John 12:46"},
      { text: "You were once darkness, but now you are light in the Lord. Walk as children of light.", reference: "Ephesians 5:8" },
      { text: "\"Whoever hears my word and believes him who sent me has eternal life and will not be judged but has crossed over from death to life.\" —Jesus", reference: "John 5:24" },
      { text: "God has given us eternal life, and this life is in his Son. The one who has the Son has life. The one who does not have the Son of God does not have life.", reference: "1 John 5:11–12" },
      { text: "The people walking in darkness have seen a great light; a light has dawned on those living in the land of darkness.", reference: "Isaiah 9:2" },
      { text: "Your word is a lamp for my feet and a light on my path.", reference: "Psalm 119:105"}
    ];

    const versePanel = document.querySelector(".verse-panel");
    const verseContent = document.querySelector(".verse-content");
    
    if (!VERSE_PANEL_ENABLED && versePanel) {
      versePanel.style.display = 'none';
    }

    let currentVerseIndex = Math.floor(Math.random() * bibleVerses.length);
    let isFirstVerse = true;

    function updateVersePanel() {
      if (!VERSE_PANEL_ENABLED || !verseContent) return;
      const verse = bibleVerses[currentVerseIndex];
      
      if (isFirstVerse) {
        verseContent.innerHTML = `<span>${verse.text}</span><strong>${verse.reference}</strong>`;
        window.setTimeout(() => versePanel.style.opacity = '1', 50);
        isFirstVerse = false;
      } else {
        verseContent.classList.add("fade-out");
        window.setTimeout(() => {
          verseContent.innerHTML = `<span>${verse.text}</span><strong>${verse.reference}</strong>`;
          verseContent.classList.remove("fade-out");
        }, 220);
      }
      currentVerseIndex = (currentVerseIndex + 1) % bibleVerses.length;
    }

    // ─── Locator dot + trail ─────────────────────────────────────────────────
    const SMASHBURGER_MODE = new URLSearchParams(window.location.search).get("smashburger") === "y";
    const TRAIL_ENABLED    = true;   
    const DRIFT_INTERVAL   = 8000;   
    const TRAIL_RADIUS     = 120;    
    const FADE_RATE        = 0.004;  

    const canvas = document.getElementById("light-trail");
    const ctx    = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function hexRgba(hex, alpha) {
      const n = parseInt(hex.replace("#", ""), 16);
      const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      return `rgba(${r},${g},${b},${alpha})`;
    }

    const glowTrail = {
      setupDot(dotEl) {
        dotEl.style.backgroundColor = DOT_COLOR;
        dotEl.style.color           = DOT_COLOR;
      },
      paintTrail(xVw, yVh) {
        const x = (xVw / 100) * canvas.width;
        const y = (yVh / 100) * canvas.height;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, TRAIL_RADIUS);
        grad.addColorStop(0,   hexRgba(TRAIL_COLOR, 0.38));
        grad.addColorStop(0.4, hexRgba(TRAIL_COLOR, 0.16));
        grad.addColorStop(1,   hexRgba(TRAIL_COLOR, 0));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, TRAIL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      },
      animateTrail() {
        const tick = () => {
          ctx.globalCompositeOperation = "destination-out";
          ctx.fillStyle = `rgba(0,0,0,${FADE_RATE})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.globalCompositeOperation = "source-over";
          requestAnimationFrame(tick);
        };
        tick();
      }
    };

    const smashburgerTrail = {
      setupDot(dotEl) {
        dotEl.style.backgroundColor = "transparent";
        dotEl.style.boxShadow       = "none";
        dotEl.style.width           = "auto";
        dotEl.style.height          = "auto";
        dotEl.style.fontSize        = "1.8rem";
        dotEl.style.lineHeight      = "1";
        dotEl.textContent           = "🍔";
      },
      paintTrail(xVw, yVh) {
        const stamp = document.createElement("div");
        stamp.className   = "burger-stamp";
        stamp.textContent = "🍔";
        stamp.style.left  = xVw + "vw";
        stamp.style.top   = yVh + "dvh"; // <-- Change this from "vh" to "dvh"
        document.body.appendChild(stamp);
        stamp.addEventListener("animationend", () => stamp.remove());
      },
      animateTrail() {}
    };

    const trailStrategy = SMASHBURGER_MODE ? smashburgerTrail : glowTrail;
    const dot = document.getElementById("locator");
    
    trailStrategy.setupDot(dot);
    if (TRAIL_ENABLED) trailStrategy.animateTrail();

    let currentX = null, currentY = null;
    let isFirstMove = true;

    function moveDot() {
      if (TRAIL_ENABLED && currentX !== null) trailStrategy.paintTrail(currentX, currentY);
      
      currentX = 25 + Math.random() * 50; 
      currentY = 30 + Math.random() * 45; 

      if (isFirstMove) {
        currentX = 25 + 0.5 * 50;
        currentY = 25 + 0.5 * 50;
        isFirstMove = false;
      }

      dot.style.left = currentX + "vw";
      dot.style.top  = currentY + "dvh"; // <-- Change this from "vh" to "dvh"
      
      if (VERSE_PANEL_ENABLED) updateVersePanel();
    }

    moveDot();
    setInterval(moveDot, DRIFT_INTERVAL);
  </script>
</body>
</html>
