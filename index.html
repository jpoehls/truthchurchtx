<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth Church — Luling, Texas</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f5f4f2;
      color: #1a1a1a;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .center {
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    p {
      margin-top: 0.75rem;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: #888;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="center">
    <h1>Truth Church</h1>
    <p>Luling, Texas</p>
  </div>
</body>
</html>
